# Benchmark workflow for the pandas-dev/pandas fork.
#
# Workload: the COMPLETE "ubuntu" job from upstream
# .github/workflows/unit-tests.yml (transcribed from upstream 2026-07-23 --
# re-verify against the file at the pinned commit) for the matrix leg
# { platform: ubuntu-24.04, environment: py311, marker: "" }: pixi
# environment, meson build of the C/Cython extensions, import check, then
# BOTH test passes (not single_cpu with xdist, then single_cpu) via
# upstream's own ./.github/actions/run-tests, with the mysql/postgres/moto
# service containers upstream runs against. The ONLY cut is the Codecov
# upload (needs upstream's CODECOV_TOKEN secret).
#
# Upstream's ./.github/actions/setup-pixi wrapper is inlined below (it
# hard-wires cache: true and cache-write on push-to-main, which would break
# cold/warm control); the same underlying prefix-dev/setup-pixi action and
# inputs are used, with caching guarded by cache_state.
#
# See forks/vite/benchmark.yml for the conventions shared by all forks
# (runs-on mapping, "workload:" step-name prefix, cold/warm semantics).

name: benchmark
run-name: "bench ${{ inputs.environment }} ${{ inputs.cache_state }} ${{ inputs.batch_id }} ${{ inputs.run_key }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Runner environment under test
        type: choice
        required: true
        options: [github, github-8core, ec2, blacksmith, blacksmith-4vcpu]
      cache_state:
        description: cold = no caches, warm = upstream cache configuration
        type: choice
        required: true
        options: [cold, warm]
      batch_id:
        description: Collection batch this run belongs to
        type: string
        required: true
      run_key:
        description: Unique key set by the orchestrator to find this run via the API
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -euox pipefail {0}

env:
  LANG: C.UTF-8
  PIXI_ENV: py311

jobs:
  benchmark:
    runs-on: ${{ fromJSON('{"github":"ubuntu-latest","github-8core":"benchmark-8core","ec2":"benchmark-ec2","blacksmith":"blacksmith-8vcpu-ubuntu-2404","blacksmith-4vcpu":"blacksmith-4vcpu-ubuntu-2404"}')[inputs.environment] }}
    timeout-minutes: 120

    # Upstream "ubuntu" job service containers, verbatim.
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: pandas
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

      postgres:
        image: postgres:18
        env:
          PGUSER: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pandas
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      moto:
        image: motoserver/moto:5.1.18
        ports:
          - 5000:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Start telemetry
        uses: ./.github/actions/telemetry/start
        continue-on-error: true
        with:
          runner_label: ${{ inputs.environment }}

      # --- inlined ./.github/actions/setup-pixi, caching under our control ---
      - name: Create virtual environment with Pixi
        uses: prefix-dev/setup-pixi@v0.10.0 # version upstream pins; re-check at pin time
        with:
          pixi-version: v0.69.0
          log-level: vv
          manifest-path: pixi.toml
          environments: ${{ env.PIXI_ENV }}
          cache: ${{ inputs.cache_state == 'warm' }}
          cache-write: ${{ inputs.cache_state == 'warm' }}

      # --- upstream "ubuntu" job steps, in upstream order ---
      - name: "workload: Build pandas"
        run: |
          pixi run \
            --environment ${{ env.PIXI_ENV }} \
            build-pandas \
            --editable \
            -Csetup-args="--werror"

      - name: "workload: Import check"
        run: |
          pixi run \
            --environment ${{ env.PIXI_ENV }} \
            ci-check-import

      - name: "workload: Test (not single_cpu)"
        uses: ./.github/actions/run-tests
        env:
          # Ensure port matches moto service
          PANDAS_MOTO_URL: "http://localhost:5000"
        with:
          environment: ${{ env.PIXI_ENV }}
          numprocesses: "auto"
          pytest_marker_expression: "not single_cpu"
          pytest_target: pandas
          pandas_future_infer_string: "1"
          pandas_future_python_scalars: "0"

      - name: "workload: Test (single_cpu)"
        uses: ./.github/actions/run-tests
        env:
          # Ensure port matches moto service
          PANDAS_MOTO_URL: "http://localhost:5000"
        with:
          environment: ${{ env.PIXI_ENV }}
          numprocesses: 0
          pytest_marker_expression: "single_cpu"
          pytest_target: pandas
          pandas_future_infer_string: "1"
          pandas_future_python_scalars: "0"

      # Upstream's final step, "Upload test coverage to Codecov", is the one
      # omission: it requires upstream's CODECOV_TOKEN secret.

      - name: Stop telemetry
        if: always()
        uses: ./.github/actions/telemetry/stop
